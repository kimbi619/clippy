name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── Go bridge ───────────────────────────────────────────────────────────────
  bridge:
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: bridge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: bridge/go.sum

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build ./cmd/clippy

  # ── Django backend ───────────────────────────────────────────────────────────
  backend:
    name: backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt psycopg2-binary

      - name: test
        env:
          BRIDGE_API_KEY: ci-test-key
          SECRET_KEY: ci-secret-key-not-for-production
        run: python manage.py test --settings=clippy.test_settings --verbosity=2
